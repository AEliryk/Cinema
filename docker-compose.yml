name: cinema

services:
    db:
        image: postgres:16-alpine
        container_name: cinema_db
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-movie}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-movie}" ]
            interval: 5s
            timeout: 5s
            retries: 5

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: cinema_backend
        restart: always
        ports:
            - "8000:8000"
        environment:
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
            - POSTGRES_DB=${POSTGRES_DB:-movie}
            - POSTGRES_HOST=db
            - POSTGRES_PORT=5432
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./backend:/app/backend

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        container_name: cinema_frontend
        restart: always
        ports:
            - "3000:3000"
        environment:
            - INTERNAL_API_URL=http://app:8000
            - NEXT_PUBLIC_API_URL=http://localhost:8000
        depends_on:
            - app

volumes:
    postgres_data:
        name: project1_postgres_data
        external: true
